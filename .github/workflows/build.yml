name: Build NeuroBizAI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --recursion-limit 5000 --name NeuroBizAI --hidden-import streamlit --hidden-import analyzer --hidden-import graph --hidden-import speech --hidden-import sklearn --hidden-import networkx --hidden-import matplotlib --hidden-import numpy --hidden-import pandas --hidden-import reportlab --add-data "app.py;." --add-data "analyzer.py;." --add-data "graph.py;." --add-data "speech.py;." --add-data "llm_tuner;llm_tuner" --add-data "pages;pages" --add-data "assets;assets" launcher.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NeuroBizAI
        path: dist/NeuroBizAI.exe
